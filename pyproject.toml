[project]
name = "invest-agent"
version = "0.1.0"
description = "개인용 AI 자율투자 실험 시스템 (OFFLINE_SIM 기본)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.0,<3",
    "pydantic-settings>=2,<3",
    "jsonschema[format-nongpl]>=4,<5",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.scripts]
invest = "invest_agent.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
invest_agent = ["migrations/*.sql"]

[tool.setuptools.data-files]
"share/invest_agent/schemas" = ["schemas/decision_proposal.schema.json", "schemas/context_envelope.schema.json"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
